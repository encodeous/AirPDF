syntax = "proto3";

package airpdf.v1;

option go_package = "airpdf/proto;airpdfv1";

// Top-level framed message exchanged between macOS and iPadOS peers.
message SyncEnvelope {
  // Milliseconds since Unix epoch.
  int64 timestamp_ms = 1;
  Payload payload = 2;
}

message Payload {
  oneof body {
    Ping ping = 1;
    Pong pong = 2;
    // iPad → Mac: sent immediately after the QUIC connection is established.
    Hello hello = 3;
    // Mac → iPad: reply to Hello.  Followed immediately by PdfData for every
    // currently-open document so the iPad can restore full session state.
    Welcome welcome = 4;
    // Mac → iPad: open or replace a document tab.
    // `content` is always stripped of all ink annotations before sending so
    // the iPad's PKCanvasView overlay is the sole renderer of strokes.
    // `page_drawings` delivers the current per-page PKDrawing state in the same
    // message, avoiding a separate round-trip after ink is removed from the PDF.
    PdfData pdf_data = 5;
    // iPad → Mac: one or more finalized strokes added to the named document/page.
    // Batched to reduce per-stroke framing overhead during fast writing.
    StrokeBatch stroke_batch = 6;
    // Bidirectional:
    //   iPad → Mac  after a local undo, erase, or selection-delete.
    //   Mac → iPad  to roll back a stroke the Mac rejected (e.g. out-of-sync state).
    StrokeRemove stroke_remove = 7;
    // Mac → iPad: close and remove the named document tab.
    PdfClose pdf_close = 8;
    // Bidirectional — global document-level undo.
    //   iPad → Mac: the iPad user triggered undo on their stroke canvas (e.g.
    //     pencil double-tap or keyboard shortcut).  The stroke diff already
    //     propagates naturally via StrokeRemove; this message tells the Mac to
    //     pop its global undo stack in sync.  If the top of the Mac's stack is
    //     a non-stroke action (e.g. a text box the Mac added), the Mac applies
    //     the undo locally and re-sends PdfData with the updated document state.
    //   Mac → iPad: the Mac user triggered undo whose top action is a stroke.
    //     The iPad invokes its PKCanvasView UndoManager; the resulting
    //     PKDrawing diff propagates back as StrokeRemove.  If the top action
    //     is non-stroke, the Mac handles it locally and re-sends PdfData
    //     without sending Undo to the iPad.
    Undo undo = 9;
    // Same as Undo but for redo.
    Redo redo = 10;
    Error error = 11;
  }
}

// ── Handshake ─────────────────────────────────────────────────────────────────

// iPad → Mac on every new connection.
message Hello {
  // Semantic version of the AirPDF wire protocol (e.g. "1.0.0").
  // The Mac rejects incompatible versions with ERROR_CODE_UNSUPPORTED_VERSION.
  string protocol_version = 1;
  // Human-readable app build version for diagnostic logging (e.g. "0.1.0").
  string app_version = 2;
}

// Mac → iPad reply to Hello.
message Welcome {
  // Protocol version the Mac will speak.  Must equal Hello.protocol_version;
  // the iPad disconnects and surfaces an error if it differs.
  string protocol_version = 1;
  // Opaque session identifier.  If the iPad reconnects and receives a
  // different session_id it must discard all cached document state; the Mac
  // will re-deliver PdfData for every open document immediately after Welcome.
  string session_id = 2;
}

// ── Connectivity ──────────────────────────────────────────────────────────────

message Ping {
  uint64 sequence = 1;
}

message Pong {
  uint64 sequence = 1;
}

// ── Document lifecycle ────────────────────────────────────────────────────────

// Mac → iPad
message PdfData {
  // Stable UUID assigned by the Mac for the lifetime of the open document.
  string document_id = 1;
  // Original filename shown in the iPad tab bar (e.g. "Lecture Notes.pdf").
  string file_name = 2;
  // Raw PDF bytes with ALL ink annotations stripped.  Stripping prevents the
  // PDF renderer and the PKCanvasView overlay from both drawing the same strokes.
  // Re-sending with the same document_id silently replaces the iPad's cached copy
  // (used when the Mac adds text boxes, new pages, or other non-ink edits).
  bytes content = 3;
  // Raw 32-byte SHA-256 digest of `content` for integrity checking on the iPad.
  bytes sha256 = 4;
  // Per-page PKDrawing snapshots keyed by 0-based page index (first page = 0).
  // Value is PKDrawing.dataRepresentation() binary for that page.
  // Pages absent from this map have no strokes; the iPad initializes them with
  // an empty PKDrawing.  This field replaces what would otherwise require many
  // individual StrokeBatch messages to reconstruct stroke state after open.
  map<uint32, bytes> page_drawings = 5;
  // Total number of pages in the PDF.  Lets the iPad pre-allocate its per-page
  // PKDrawing cache without parsing the PDF bytes first.
  uint32 page_count = 6;
}

// Mac → iPad
message PdfClose {
  string document_id = 1;
}

// ── Stroke synchronisation ────────────────────────────────────────────────────

// iPad → Mac: one or more finalized strokes to add.
message StrokeBatch {
  string document_id = 1;
  uint32 page_index = 2;
  repeated StrokeEntry strokes = 3;
}

message StrokeEntry {
  // UUID string assigned by the iPad.  Used for deduplication and as the key
  // in subsequent StrokeRemove messages.
  string stroke_id = 1;
  // Serialized stroke data.  Because PKStroke has no public standalone
  // serializer, this is PKDrawing.dataRepresentation() of a single-stroke
  // PKDrawing (i.e. PKDrawing(strokes: [stroke]).dataRepresentation()).
  bytes pk_stroke_data = 2;
}

// Bidirectional — see Payload comments for per-direction semantics.
message StrokeRemove {
  string document_id = 1;
  uint32 page_index = 2;
  string stroke_id = 3;
}

// ── Undo / Redo ───────────────────────────────────────────────────────────────

// Bidirectional — see Payload comments for per-direction semantics.
// No page_index: undo/redo is a document-global operation.  The receiving
// side applies it to whichever local undo manager is appropriate
// (PKCanvasView's UndoManager on the iPad; the document UndoManager on the Mac).
message Undo {
  string document_id = 1;
}

// Bidirectional — see Payload comments for per-direction semantics.
message Redo {
  string document_id = 1;
}

// ── Errors ────────────────────────────────────────────────────────────────────

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_PAYLOAD = 1;
  ERROR_CODE_DOCUMENT_NOT_FOUND = 2;
  ERROR_CODE_UNSUPPORTED_VERSION = 3;
  ERROR_CODE_INTERNAL = 4;
  // Returned when a StrokeRemove references a stroke_id that is not present
  // in the receiver's drawing for that page.
  ERROR_CODE_STROKE_NOT_FOUND = 5;
}
