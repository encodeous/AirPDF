syntax = "proto3";

package airpdf.v1;

option go_package = "airpdf/proto;airpdfv1";

// Top-level framed message exchanged between macOS and iPadOS peers.
message SyncEnvelope {
  // Milliseconds since Unix epoch.
  int64 timestamp_ms = 1;
  Payload payload = 2;
}

message Payload {
  oneof body {
    Ping ping = 1;
    Pong pong = 2;
    PdfData pdf_data = 3;
    StrokeAdd stroke_add = 4;
    StrokeRemove stroke_remove = 5;
    PageTurn page_turn = 6;
    Undo undo = 7;
    Redo redo = 8;
    Error error = 9;
  }
}

message Ping {
  uint64 sequence = 1;
}

message Pong {
  uint64 sequence = 1;
}

message PdfData {
  string document_id = 1;
  string file_name = 2;
  bytes content = 3;
  // Raw 32-byte SHA-256 digest of `content`.
  bytes sha256 = 4;
}

message StrokeAdd {
  string document_id = 1;
  uint32 page_index = 2;
  string stroke_id = 3;
  bytes pk_stroke_data = 4; // Platform-native serialized PKStroke data.
}

message StrokeRemove {
  string document_id = 1;
  uint32 page_index = 2;
  string stroke_id = 3;
}

message PageTurn {
  string document_id = 1;
  uint32 page_index = 2;
}

message Undo {
  string document_id = 1;
}

message Redo {
  string document_id = 1;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_PAYLOAD = 1;
  ERROR_CODE_DOCUMENT_NOT_FOUND = 2;
  ERROR_CODE_PAGE_OUT_OF_RANGE = 3;
  ERROR_CODE_UNSUPPORTED_VERSION = 4;
  ERROR_CODE_INTERNAL = 5;
}
